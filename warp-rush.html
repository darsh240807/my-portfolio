<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>CLAUDE × HIGGSFIELD — WARP RUSH</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #05010f;
    overflow: hidden;
    font-family: "Courier New", ui-monospace, monospace;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: optimizeSpeed;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    color: #6a5a9a;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    user-select: none;
    text-shadow: 0 0 8px #1a0f3a;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">SPACE / CLICK / TAP&nbsp;·&nbsp;flip gravity&nbsp;&nbsp;&nbsp;SHIFT / 2-FINGER&nbsp;·&nbsp;WARP</div>
<script>
(() => {
  "use strict";

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const TAU = Math.PI * 2;
  const now = () => performance.now();

  let best = 0;
  try { best = parseInt(localStorage.getItem("warprush_best") || "0", 10) || 0; } catch (e) {}

  // ---------- game state ----------
  const STATE = { MENU: 0, PLAY: 1, DEAD: 2 };
  let state = STATE.MENU;

  const player = {
    x: 0, y: 0, r: 13,
    gravDir: 1,        // 1 = down, -1 = up
    vy: 0,
    trail: [],
  };

  let obstacles = [];
  let orbs = [];
  let particles = [];
  let stars = [];
  let ripples = [];

  let score = 0, displayScore = 0, combo = 0, comboTimer = 0, mult = 1;
  let warp = 0;                 // 0..1 charge
  let warpActive = 0;           // seconds remaining
  let timeScale = 1;
  let speed = 0;
  let dist = 0;
  let shake = 0;
  let flashT = 0, flashColor = "#ffffff";
  let spawnT = 0, orbT = 0;
  let hue = 265;
  let deadAt = 0;
  let startAt = 0;
  let chroma = 0;

  const GRAV = 2600;      // px/s^2
  const FLIP_KICK = 120;  // small bounce on flip
  const LANE_PAD = 70;    // top/bottom play area padding

  function reset() {
    obstacles = [];
    orbs = [];
    particles = [];
    ripples = [];
    player.x = Math.max(120, W * 0.26);
    player.y = H * 0.5;
    player.gravDir = 1;
    player.vy = 0;
    player.trail = [];
    score = 0; displayScore = 0; combo = 0; comboTimer = 0; mult = 1;
    warp = 0; warpActive = 0; timeScale = 1;
    speed = 340;
    dist = 0;
    shake = 0;
    spawnT = 0.7; orbT = 0.4;
    startAt = now();
    state = STATE.PLAY;
  }

  function initStars() {
    stars = [];
    const n = Math.round((W * H) / 9000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: rand(0, W), y: rand(0, H),
        z: rand(0.2, 1),
        r: rand(0.4, 1.8),
      });
    }
  }
  initStars();
  window.addEventListener("resize", initStars);

  // ---------- particles ----------
  function burst(x, y, color, count, spd, life) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, TAU);
      const s = rand(spd * 0.25, spd);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(life * 0.5, life),
        max: life,
        r: rand(1.5, 4.5),
        color,
      });
    }
  }

  function ring(x, y, color, r0, r1) {
    ripples.push({ x, y, r: r0, max: r1, life: 1, color });
  }

  // ---------- input ----------
  function flip() {
    if (state === STATE.MENU) { reset(); return; }
    if (state === STATE.DEAD) {
      if (now() - deadAt > 550) { reset(); }
      return;
    }
    player.gravDir *= -1;
    player.vy = -player.gravDir * FLIP_KICK;
    burst(player.x, player.y, `hsl(${hue},90%,65%)`, 10, 260, 0.5);
    ring(player.x, player.y, `hsl(${hue},90%,70%)`, player.r, player.r + 46);
    shake = Math.min(shake + 3, 14);
  }

  function tryWarp() {
    if (state !== STATE.PLAY) return;
    if (warp >= 1 && warpActive <= 0) {
      warpActive = 2.2;
      warp = 0;
      shake = 20;
      flashT = 0.25; flashColor = "#b9a6ff";
      ring(player.x, player.y, "#c9b8ff", player.r, 220);
      burst(player.x, player.y, "#d9ccff", 46, 620, 0.9);
    }
  }

  window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      e.preventDefault(); flip();
    } else if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyE") {
      e.preventDefault(); tryWarp();
    }
  });

  cv.addEventListener("mousedown", (e) => { e.preventDefault(); flip(); });

  cv.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length >= 2) tryWarp();
    else flip();
  }, { passive: false });

  // ---------- spawning ----------
  function spawnObstacle() {
    // pillars from top and/or bottom with a gap the player must weave through
    const gap = rand(150, 210);
    const usable = H - LANE_PAD * 2 - gap;
    const topH = LANE_PAD + rand(0, usable);
    const w = rand(26, 46);
    const kind = Math.random();
    const col = `hsl(${(hue + rand(-30, 30) + 360) % 360},85%,58%)`;

    if (kind < 0.62) {
      // pair with a gap
      obstacles.push({ x: W + 40, y: 0, w, h: topH, hit: 0, color: col });
      obstacles.push({ x: W + 40, y: topH + gap, w, h: H - (topH + gap), hit: 0, color: col });
    } else if (kind < 0.82) {
      // single spike bar (top or bottom)
      const fromTop = Math.random() < 0.5;
      const bh = rand(90, H * 0.45);
      obstacles.push({
        x: W + 40, y: fromTop ? 0 : H - bh, w, h: bh, hit: 0, color: col,
      });
    } else {
      // floating block in the middle
      const bh = rand(60, 150);
      const by = rand(LANE_PAD, H - LANE_PAD - bh);
      obstacles.push({ x: W + 40, y: by, w: rand(34, 60), h: bh, hit: 0, color: col });
    }
  }

  function spawnOrb() {
    orbs.push({
      x: W + 30,
      y: rand(LANE_PAD + 20, H - LANE_PAD - 20),
      r: 9,
      t: rand(0, TAU),
      got: 0,
    });
  }

  // ---------- collision ----------
  function circleRect(cx, cy, cr, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  // ---------- update ----------
  function update(dt) {
    hue = (hue + dt * 12) % 360;

    // background stars always drift
    const bgSpeed = state === STATE.PLAY ? speed : 90;
    for (const s of stars) {
      s.x -= bgSpeed * s.z * dt * (state === STATE.PLAY ? 1 : 0.4);
      if (s.x < -4) { s.x = W + 4; s.y = rand(0, H); }
    }

    // ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += (rp.max - rp.r) * clamp(dt * 6, 0, 1);
      rp.life -= dt * 2.2;
      if (rp.life <= 0) ripples.splice(i, 1);
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 40);
    if (flashT > 0) flashT -= dt;

    if (state !== STATE.PLAY) return;

    // ----- warp / time -----
    if (warpActive > 0) {
      warpActive -= dt;               // warp uses real time
      timeScale += (0.32 - timeScale) * clamp(dt * 8, 0, 1);
      chroma += (6 - chroma) * clamp(dt * 6, 0, 1);
    } else {
      timeScale += (1 - timeScale) * clamp(dt * 6, 0, 1);
      chroma += (0 - chroma) * clamp(dt * 6, 0, 1);
    }
    const g = dt * timeScale;          // scaled dt for the world

    // difficulty ramp
    const elapsed = (now() - startAt) / 1000;
    speed = 340 + Math.min(elapsed * 12, 520) + score * 0.01;

    dist += speed * g;

    // ----- player physics -----
    player.vy += GRAV * player.gravDir * g;
    player.vy = clamp(player.vy, -1500, 1500);
    player.y += player.vy * g;

    // clamp to lane (walls kill combo lightly but not fatal)
    const top = player.r + 4, bot = H - player.r - 4;
    if (player.y < top) { player.y = top; player.vy = 0; }
    if (player.y > bot) { player.y = bot; player.vy = 0; }

    // trail
    player.trail.push({ x: player.x, y: player.y });
    if (player.trail.length > 18) player.trail.shift();

    // ----- spawns -----
    spawnT -= g;
    const spawnEvery = clamp(1.15 - elapsed * 0.01, 0.42, 1.15);
    if (spawnT <= 0) { spawnObstacle(); spawnT = spawnEvery * rand(0.75, 1.15); }
    orbT -= g;
    if (orbT <= 0) { spawnOrb(); orbT = rand(0.5, 1.3); }

    // ----- obstacles -----
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * g;
      if (o.hit > 0) o.hit -= dt * 3;
      // near-miss pass = points + shake
      if (!o.passed && o.x + o.w < player.x - player.r) {
        o.passed = 1;
        addScore(5, player.x, player.y, false);
      }
      if (o.x + o.w < -60) { obstacles.splice(i, 1); continue; }

      if (warpActive <= 0 && circleRect(player.x, player.y, player.r - 2, o.x, o.y, o.w, o.h)) {
        die();
        return;
      } else if (warpActive > 0 && circleRect(player.x, player.y, player.r + 6, o.x, o.y, o.w, o.h)) {
        // phasing through during warp shreds obstacles for bonus
        o.hit = 1;
        if (!o.shredded) {
          o.shredded = 1;
          burst(player.x, o.y + o.h * 0.5, "#c9b8ff", 8, 300, 0.4);
          addScore(3, player.x, player.y, false);
        }
      }
    }

    // ----- orbs -----
    for (let i = orbs.length - 1; i >= 0; i--) {
      const or = orbs[i];
      or.x -= speed * g;
      or.t += dt * 6;
      if (or.x < -30) { orbs.splice(i, 1); continue; }
      const dx = or.x - player.x, dy = or.y - player.y;
      const magnet = warpActive > 0 ? 120 : 46;
      const d2 = dx * dx + dy * dy;
      if (d2 < magnet * magnet) {
        // pull toward player a bit
        or.x -= dx * clamp(dt * 6, 0, 1);
        or.y -= dy * clamp(dt * 6, 0, 1);
      }
      if (d2 < (or.r + player.r) * (or.r + player.r)) {
        orbs.splice(i, 1);
        collectOrb(or.x, or.y);
      }
    }

    // ----- combo decay -----
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) { combo = 0; mult = 1; }
    }

    // score readout easing
    displayScore += (score - displayScore) * clamp(dt * 10, 0, 1);
  }

  function addScore(base, x, y, big) {
    score += Math.round(base * mult);
  }

  function collectOrb(x, y) {
    combo++;
    comboTimer = 2.6;
    mult = 1 + Math.floor(combo / 5);
    mult = clamp(mult, 1, 9);
    score += Math.round(10 * mult);
    warp = clamp(warp + 0.09, 0, 1);
    const c = `hsl(${(hue + 40) % 360},95%,66%)`;
    burst(x, y, c, 14, 340, 0.6);
    ring(x, y, c, 4, 40);
    shake = Math.min(shake + 2.5, 16);
    flashT = Math.max(flashT, 0.06); flashColor = "#3a2a6a";
  }

  function die() {
    state = STATE.DEAD;
    deadAt = now();
    shake = 26;
    flashT = 0.3; flashColor = "#ff3b6b";
    burst(player.x, player.y, "#ff5580", 60, 640, 1.0);
    burst(player.x, player.y, "#ffffff", 24, 420, 0.7);
    ring(player.x, player.y, "#ff5580", player.r, 260);
    if (score > best) {
      best = Math.round(score);
      try { localStorage.setItem("warprush_best", String(best)); } catch (e) {}
    }
  }

  // ---------- draw ----------
  function draw() {
    ctx.save();

    // shake
    let sx = 0, sy = 0;
    if (shake > 0.1) {
      sx = rand(-shake, shake);
      sy = rand(-shake, shake);
    }
    ctx.translate(sx, sy);

    // background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#0a0320");
    grad.addColorStop(0.5, "#120636");
    grad.addColorStop(1, "#05010f");
    ctx.fillStyle = grad;
    ctx.fillRect(-40, -40, W + 80, H + 80);

    // warp radial glow
    if (warpActive > 0) {
      const rg = ctx.createRadialGradient(player.x, player.y, 10, player.x, player.y, Math.max(W, H) * 0.7);
      rg.addColorStop(0, "rgba(150,120,255,0.28)");
      rg.addColorStop(1, "rgba(150,120,255,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(-40, -40, W + 80, H + 80);
    }

    // horizon grid (synthwave)
    drawGrid();

    // stars
    for (const s of stars) {
      ctx.globalAlpha = 0.35 + s.z * 0.5;
      ctx.fillStyle = s.z > 0.7 ? "#cbb8ff" : "#5a4a8a";
      ctx.fillRect(s.x, s.y, s.r, s.r);
    }
    ctx.globalAlpha = 1;

    // ripples
    for (const rp of ripples) {
      ctx.globalAlpha = clamp(rp.life, 0, 1) * 0.8;
      ctx.strokeStyle = rp.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, TAU);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (state !== STATE.MENU) {
      drawObstacles();
      drawOrbs();
      drawPlayer();
    }

    // particles
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // flash overlay
    if (flashT > 0) {
      ctx.globalAlpha = clamp(flashT * 2, 0, 0.6);
      ctx.fillStyle = flashColor;
      ctx.fillRect(-40, -40, W + 80, H + 80);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // UI is drawn without shake
    drawUI();
    drawScanlines();
  }

  function drawGrid() {
    const horizon = H * 0.5;
    ctx.strokeStyle = "rgba(120,60,200,0.14)";
    ctx.lineWidth = 1;
    // vertical converging lines
    const cxc = W * 0.5;
    for (let i = -10; i <= 10; i++) {
      ctx.beginPath();
      ctx.moveTo(cxc + i * 40, horizon);
      ctx.lineTo(cxc + i * 240, H + 60);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cxc + i * 40, horizon);
      ctx.lineTo(cxc + i * 240, -60);
      ctx.stroke();
    }
    const off = (dist * 0.15) % 60;
    for (let i = 0; i < 12; i++) {
      const t = i / 12;
      const yb = horizon + Math.pow(t, 2) * (H * 0.55) + off * (t + 0.2);
      const yt = horizon - Math.pow(t, 2) * (H * 0.55) - off * (t + 0.2);
      ctx.globalAlpha = (1 - t) * 0.5;
      ctx.beginPath(); ctx.moveTo(-40, yb); ctx.lineTo(W + 40, yb); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-40, yt); ctx.lineTo(W + 40, yt); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacles() {
    for (const o of obstacles) {
      ctx.save();
      ctx.shadowColor = o.color;
      ctx.shadowBlur = 18;
      ctx.fillStyle = o.hit > 0 ? "#ffffff" : "rgba(10,4,26,0.85)";
      roundRect(o.x, o.y, o.w, o.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = o.color;
      roundRect(o.x, o.y, o.w, o.h, 6);
      ctx.stroke();
      // inner scan
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = o.color;
      ctx.lineWidth = 1;
      const yy = o.y + ((dist * 0.5) % Math.max(20, o.h));
      ctx.beginPath(); ctx.moveTo(o.x + 3, yy); ctx.lineTo(o.x + o.w - 3, yy); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function drawOrbs() {
    for (const or of orbs) {
      const pulse = 1 + Math.sin(or.t) * 0.18;
      ctx.save();
      ctx.shadowColor = "#ffd35a";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "#ffe08a";
      ctx.beginPath();
      ctx.arc(or.x, or.y, or.r * pulse, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#fffbe6";
      ctx.beginPath();
      ctx.arc(or.x - 2, or.y - 2, or.r * 0.4, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPlayer() {
    // trail
    for (let i = 0; i < player.trail.length; i++) {
      const t = player.trail[i];
      const a = i / player.trail.length;
      ctx.globalAlpha = a * (warpActive > 0 ? 0.7 : 0.45);
      ctx.fillStyle = warpActive > 0 ? "#c9b8ff" : `hsl(${hue},90%,65%)`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, player.r * a * 0.9, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const col = warpActive > 0 ? "#d9ccff" : `hsl(${hue},95%,66%)`;
    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = 28;
    // outer core
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, TAU);
    ctx.fill();
    // white hot center
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r * 0.5, 0, TAU);
    ctx.fill();
    // gravity direction spike
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x, player.y + player.gravDir * (player.r + 10));
    ctx.stroke();
    ctx.restore();
  }

  // ---------- UI ----------
  function txt(s, x, y, size, color, align, weight) {
    ctx.font = `${weight || "bold"} ${size}px "Courier New", monospace`;
    ctx.textAlign = align || "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = color;
    ctx.fillText(s, x, y);
  }

  function drawUI() {
    if (state === STATE.MENU) {
      drawTitle();
      return;
    }

    // score
    ctx.shadowColor = "#000"; ctx.shadowBlur = 8;
    txt(String(Math.round(displayScore)).padStart(6, "0"), 20, 44, 34, "#ffffff", "left");
    ctx.shadowBlur = 0;
    txt("BEST " + best, 20, 66, 13, "#7a6aaa", "left");

    // multiplier
    if (mult > 1) {
      const pop = 1 + Math.sin(now() / 90) * 0.06;
      ctx.save();
      ctx.translate(20, 96);
      ctx.scale(pop, pop);
      txt("×" + mult + "  " + combo + " COMBO", 0, 0, 18, `hsl(${(hue+40)%360},95%,68%)`, "left");
      ctx.restore();
    }

    // warp meter
    const mw = 220, mh = 12, mx = W - mw - 20, my = 28;
    ctx.strokeStyle = "#3a2a6a"; ctx.lineWidth = 2;
    roundRect(mx, my, mw, mh, 6); ctx.stroke();
    const fillW = (mw - 4) * warp;
    const ready = warp >= 1;
    ctx.fillStyle = ready ? `hsl(${(now()/6)%360},90%,66%)` : "#8a6aff";
    if (fillW > 0) roundRect(mx + 2, my + 2, fillW, mh - 4, 4), ctx.fill();
    txt(ready ? "WARP READY — SHIFT" : "WARP", mx + mw, my + mh + 16, 12,
        ready ? "#ffffff" : "#7a6aaa", "right");

    if (state === STATE.DEAD) drawDead();
  }

  function drawTitle() {
    const cx = W * 0.5, cy = H * 0.42;
    const t = now() / 1000;
    ctx.save();
    ctx.textAlign = "center";
    // glowing title
    ctx.shadowColor = `hsl(${hue},95%,60%)`;
    ctx.shadowBlur = 30;
    txt("WARP RUSH", cx, cy, Math.min(84, W * 0.16), "#ffffff", "center");
    ctx.shadowBlur = 0;
    txt("CLAUDE  ×  HIGGSFIELD", cx, cy - Math.min(84, W * 0.16) * 0.7,
        Math.min(20, W * 0.045), `hsl(${(hue+40)%360},90%,70%)`, "center");

    const pulse = 0.6 + Math.sin(t * 3) * 0.4;
    ctx.globalAlpha = pulse;
    txt("PRESS  SPACE  /  TAP  TO  START", cx, cy + 60, 20, "#c9b8ff", "center");
    ctx.globalAlpha = 1;

    txt("flip gravity to weave the neon.  grab orbs.  charge WARP.  don't die.",
        cx, cy + 100, 13, "#6a5a9a", "center");
    txt("BEST  " + best, cx, cy + 128, 15, "#7a6aaa", "center");
    ctx.restore();
  }

  function drawDead() {
    const cx = W * 0.5, cy = H * 0.42;
    ctx.save();
    ctx.fillStyle = "rgba(5,1,15,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.shadowColor = "#ff3b6b"; ctx.shadowBlur = 24;
    txt("SYSTEM BREACH", cx, cy, Math.min(56, W * 0.11), "#ff5580", "center");
    ctx.shadowBlur = 0;
    txt("SCORE  " + Math.round(score), cx, cy + 46, 26, "#ffffff", "center");
    const isBest = Math.round(score) >= best && score > 0;
    txt(isBest ? "★ NEW BEST ★" : "BEST  " + best, cx, cy + 76, 16,
        isBest ? "#ffd35a" : "#7a6aaa", "center");
    const ready = now() - deadAt > 550;
    const pulse = 0.55 + Math.sin(now() / 180) * 0.45;
    ctx.globalAlpha = ready ? pulse : 0.25;
    txt(ready ? "PRESS  SPACE  /  TAP  TO  RETRY" : "...", cx, cy + 120, 18, "#c9b8ff", "center");
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawScanlines() {
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = "#000";
    for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
    ctx.globalAlpha = 1;
    // vignette
    const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // rounded rect path helper (uses current path)
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- loop ----------
  let last = now();
  function frame() {
    const t = now();
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.05) dt = 0.05; // clamp big gaps
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
