<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>CAMPUS LIFE — 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0e1016;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #stats { position: fixed; top: 14px; left: 14px; z-index: 10; width: 216px;
    background: rgba(14,16,26,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 13px 15px; font-size: 12px; user-select: none; box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
  #stats .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  #stats .lbl { width: 52px; color: #c3cbdd; letter-spacing: .5px; font-weight: 600; }
  #stats .bar { flex: 1; height: 8px; background: rgba(255,255,255,0.13); border-radius: 6px; overflow: hidden; }
  #stats .fill { height: 100%; width: 50%; border-radius: 6px; transition: width .35s ease; box-shadow: 0 0 8px currentColor; }
  #clock { font-size: 13px; font-weight: 800; margin-bottom: 6px; color: #ffd76a; letter-spacing: .6px; text-shadow: 0 0 10px rgba(255,200,80,.4); }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(14,16,26,0.45); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12); border-radius: 22px;
    padding: 9px 18px; font-size: 12px; color: #cdd5e6; letter-spacing: .5px; white-space: nowrap; max-width: 96vw; overflow: hidden; text-overflow: ellipsis; }
  #prompt { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 11;
    background: linear-gradient(135deg,#6a86ff,#8a5cf5); border-radius: 14px; padding: 11px 20px; font-size: 15px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(90,110,255,0.5); display: none; }
  #prompt b { background: rgba(255,255,255,0.28); padding: 1px 9px; border-radius: 6px; margin: 0 2px; }
  #toast { position: fixed; bottom: 116px; left: 50%; transform: translateX(-50%) translateY(10px); z-index: 12;
    background: rgba(20,24,38,0.95); border: 1px solid rgba(255,255,255,0.16); border-radius: 12px;
    padding: 11px 18px; font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #panel { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(6,8,16,0.72); backdrop-filter: blur(6px); }
  #panel .card { width: min(430px, 90vw); background: linear-gradient(160deg,#1a1f33,#141826); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 20px; padding: 26px; box-shadow: 0 26px 70px rgba(0,0,0,0.7); }
  #panel h2 { font-size: 25px; margin-bottom: 4px; }
  #panel .sub { color: #9aa6c2; font-size: 13px; margin-bottom: 18px; }
  #panel .act { display: block; width: 100%; text-align: left; margin: 9px 0; padding: 14px 16px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 13px; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s; }
  #panel .act:hover { background: rgba(120,140,255,0.22); transform: translateX(4px); border-color: rgba(140,160,255,0.5); }
  #panel .act small { display: block; color: #9aa6c2; font-size: 12px; font-weight: 400; margin-top: 3px; }
  #panel .close { margin-top: 15px; width: 100%; padding: 12px; background: transparent;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 13px; color: #c7cfe0; cursor: pointer; font-size: 14px; font-weight: 600; }
  #panel .close:hover { background: rgba(255,255,255,0.07); }
  #stick { position: fixed; z-index: 15; width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.07); display: none; }
  #stick .nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,0.4); }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; z-index: 30;
    background: #0e1016; font-size: 15px; color: #8f9bbb; }
  #loading .sp { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #8a9cff; border-radius: 50%; animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading"><div class="sp"></div><div>Loading campus…</div></div>
<div id="stats">
  <div id="clock">Day 1 · 08:00</div>
  <div class="row"><span class="lbl">Energy</span><div class="bar"><div class="fill" id="f-energy" style="background:#4fd08a;color:#4fd08a"></div></div></div>
  <div class="row"><span class="lbl">Grades</span><div class="bar"><div class="fill" id="f-grades" style="background:#6aa8ff;color:#6aa8ff"></div></div></div>
  <div class="row"><span class="lbl">Social</span><div class="bar"><div class="fill" id="f-social" style="background:#ff8ad0;color:#ff8ad0"></div></div></div>
  <div class="row"><span class="lbl">Health</span><div class="bar"><div class="fill" id="f-health" style="background:#ff6a6a;color:#ff6a6a"></div></div></div>
  <div class="row"><span class="lbl">Money</span><div class="bar"><div class="fill" id="f-money" style="background:#ffd76a;color:#ffd76a"></div></div></div>
</div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="hint">WASD / Arrows · move&nbsp;&nbsp;·&nbsp;&nbsp;Drag · look&nbsp;&nbsp;·&nbsp;&nbsp;Shift · run&nbsp;&nbsp;·&nbsp;&nbsp;E · enter building</div>
<div id="stick"><div class="nub"></div></div>
<div id="panel"><div class="card">
  <h2 id="p-title">Building</h2>
  <div class="sub" id="p-sub"></div>
  <div id="p-acts"></div>
  <button class="close" id="p-close">Leave</button>
</div></div>

<script>/*__THREE_LIBS__*/</script>
<script>
(() => {
  "use strict";
  if (!window.THREE) { document.getElementById("loading").innerHTML = "Failed to load 3D engine."; return; }
  const T = window.THREE;

  // ---------------- renderer + post ----------------
  const app = document.getElementById("app");
  const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;
  app.appendChild(renderer.domElement);
  const MAXANI = renderer.capabilities.getMaxAnisotropy();

  const scene = new T.Scene();
  const HORIZON = new T.Color(0xcfe4ff);
  scene.fog = new T.Fog(new T.Color(0xb4cfee), 60, 185);
  const camera = new T.PerspectiveCamera(56, innerWidth / innerHeight, 0.1, 600);

  const composer = new T.EffectComposer(renderer);
  composer.addPass(new T.RenderPass(scene, camera));
  const bloom = new T.UnrealBloomPass(new T.Vector2(innerWidth, innerHeight), 0.32, 0.4, 0.92);
  composer.addPass(bloom);
  const fxaa = new T.ShaderPass(T.FXAAShader);
  composer.addPass(fxaa);
  function setFXAA() {
    const pr = renderer.getPixelRatio();
    fxaa.material.uniforms["resolution"].value.set(1 / (innerWidth * pr), 1 / (innerHeight * pr));
  }
  setFXAA();

  // ---------------- lights ----------------
  scene.add(new T.HemisphereLight(0xbfe0ff, 0x51663f, 0.55));
  const sun = new T.DirectionalLight(0xfff1d0, 1.65);
  sun.position.set(48, 70, 34);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.radius = 4;
  sun.shadow.bias = -0.0004;
  const sc = sun.shadow.camera;
  sc.left = -75; sc.right = 75; sc.top = 75; sc.bottom = -75; sc.near = 1; sc.far = 220;
  scene.add(sun);
  const fill = new T.DirectionalLight(0x9fc0ff, 0.22);
  fill.position.set(-40, 30, -30); scene.add(fill);

  // ---------------- sky dome + sun disc + clouds ----------------
  const skyMat = new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false,
    uniforms: { top: { value: new T.Color(0x2f6fd0) }, mid: { value: new T.Color(0x8fc0f5) }, bot: { value: HORIZON } },
    vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bot; void main(){ float h = normalize(vP).y; float t = clamp(h,0.0,1.0); vec3 c = mix(mid, top, pow(t,0.8)); c = mix(bot, c, clamp(h*3.0+0.15,0.0,1.0)); gl_FragColor = vec4(c,1.0); }"
  });
  scene.add(new T.Mesh(new T.SphereGeometry(400, 24, 16), skyMat));

  function radialSprite(inner, outer, size) {
    const c = document.createElement("canvas"); c.width = c.height = size;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0, inner); g.addColorStop(0.4, inner); g.addColorStop(1, outer);
    x.fillStyle = g; x.fillRect(0, 0, size, size);
    const tx = new T.CanvasTexture(c);
    return tx;
  }
  const sunSpr = new T.Sprite(new T.SpriteMaterial({ map: radialSprite("rgba(255,247,214,1)", "rgba(255,240,190,0)", 128), transparent: true, depthWrite: false, blending: T.AdditiveBlending }));
  sunSpr.scale.set(60, 60, 1);
  sunSpr.position.copy(sun.position).multiplyScalar(3.2);
  scene.add(sunSpr);

  const cloudTex = radialSprite("rgba(255,255,255,0.95)", "rgba(255,255,255,0)", 128);
  const clouds = [];
  for (let i = 0; i < 9; i++) {
    const s = new T.Sprite(new T.SpriteMaterial({ map: cloudTex, transparent: true, depthWrite: false, opacity: 0.85 }));
    const sz = 18 + Math.random() * 26;
    s.scale.set(sz, sz * 0.55, 1);
    s.position.set((Math.random()*2-1)*160, 45 + Math.random()*35, (Math.random()*2-1)*160);
    scene.add(s); clouds.push(s);
  }

  // ---------------- procedural textures ----------------
  function tex(draw, size, rep) {
    const c = document.createElement("canvas"); c.width = c.height = size;
    draw(c.getContext("2d"), size);
    const t = new T.CanvasTexture(c);
    t.wrapS = t.wrapT = T.RepeatWrapping;
    if (rep) t.repeat.set(rep, rep);
    t.anisotropy = MAXANI; t.encoding = T.sRGBEncoding;
    return t;
  }
  const grassTex = tex((x, s) => {
    x.fillStyle = "#4d9440"; x.fillRect(0, 0, s, s);
    for (let i = 0; i < 2600; i++) {
      const g = 120 + Math.random() * 90;
      x.fillStyle = `rgba(${40+Math.random()*40},${g},${50+Math.random()*40},${0.25+Math.random()*0.4})`;
      x.fillRect(Math.random()*s, Math.random()*s, 1 + Math.random()*2, 2 + Math.random()*4);
    }
    for (let i = 0; i < 14; i++) {
      x.fillStyle = `rgba(60,${100+Math.random()*40},60,0.10)`;
      x.beginPath(); x.arc(Math.random()*s, Math.random()*s, 20 + Math.random()*50, 0, 7); x.fill();
    }
  }, 256, 26);
  const pathTex = tex((x, s) => {
    x.fillStyle = "#a99f82"; x.fillRect(0, 0, s, s);
    for (let i = 0; i < 1600; i++) {
      const v = 130 + Math.random() * 55;
      x.fillStyle = `rgba(${v},${v-12},${v-34},${0.3+Math.random()*0.4})`;
      x.fillRect(Math.random()*s, Math.random()*s, 1 + Math.random()*2, 1 + Math.random()*2);
    }
    x.strokeStyle = "rgba(90,84,66,0.18)"; x.lineWidth = 1;
    for (let i = 0; i < 2; i++) { x.beginPath(); x.moveTo(Math.random()*s, 0); x.lineTo(Math.random()*s, s); x.stroke(); }
  }, 256, 1);

  function facadeTextures(wall, cols, rows) {
    const S = 256;
    const map = document.createElement("canvas"); map.width = map.height = S;
    const emi = document.createElement("canvas"); emi.width = emi.height = S;
    const mx = map.getContext("2d"), ex = emi.getContext("2d");
    mx.fillStyle = wall; mx.fillRect(0, 0, S, S);
    // faint panel noise
    for (let i = 0; i < 900; i++) { mx.fillStyle = `rgba(0,0,0,${Math.random()*0.05})`; mx.fillRect(Math.random()*S, Math.random()*S, 2, 2); }
    ex.fillStyle = "#000"; ex.fillRect(0, 0, S, S);
    const pad = 18, gw = (S - pad*2) / cols, gh = (S - pad*2) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x0 = pad + c*gw + gw*0.16, y0 = pad + r*gh + gh*0.16, w = gw*0.68, h = gh*0.62;
      // frame
      mx.fillStyle = "#e9edf5"; mx.fillRect(x0-3, y0-3, w+6, h+6);
      // glass gradient
      const lit = Math.random() < 0.5;
      const gg = mx.createLinearGradient(x0, y0, x0+w, y0+h);
      gg.addColorStop(0, lit ? "#ffe9a8" : "#bfe0ff"); gg.addColorStop(1, lit ? "#ffcf6a" : "#7fb0e6");
      mx.fillStyle = gg; mx.fillRect(x0, y0, w, h);
      mx.strokeStyle = "rgba(255,255,255,0.5)"; mx.lineWidth = 1; mx.beginPath(); mx.moveTo(x0, y0+h*0.5); mx.lineTo(x0+w, y0+h*0.5); mx.stroke();
      // emissive for lit windows
      if (lit) { ex.fillStyle = "#ffd98a"; ex.fillRect(x0, y0, w, h); }
    }
    const m = new T.CanvasTexture(map); m.anisotropy = MAXANI; m.encoding = T.sRGBEncoding;
    const e = new T.CanvasTexture(emi); e.anisotropy = MAXANI; e.encoding = T.sRGBEncoding;
    return { map: m, emissiveMap: e };
  }

  // ---------------- ground + paths ----------------
  const ground = new T.Mesh(new T.PlaneGeometry(400, 400), new T.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  function path(w, d, x, z) {
    const pt = pathTex.clone(); pt.needsUpdate = true; pt.wrapS = pt.wrapT = T.RepeatWrapping; pt.repeat.set(w/8, d/8); pt.anisotropy = MAXANI; pt.encoding = T.sRGBEncoding;
    const p = new T.Mesh(new T.PlaneGeometry(w, d), new T.MeshStandardMaterial({ map: pt, roughness: 0.95 }));
    p.rotation.x = -Math.PI/2; p.position.set(x, 0.03, z); p.receiveShadow = true; scene.add(p);
  }
  path(9, 96, 0, 0); path(96, 9, 0, 0);

  // ---------------- helpers ----------------
  const solids = [];
  function box(w, h, d, matOrColor) {
    const m = (matOrColor instanceof T.Material) ? matOrColor : new T.MeshStandardMaterial({ color: matOrColor, roughness: 0.9, flatShading: true });
    return new T.Mesh(new T.BoxGeometry(w, h, d), m);
  }
  function shad(m) { m.castShadow = true; m.receiveShadow = true; return m; }
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------------- buildings ----------------
  const buildings = [];
  function makeBuilding(name, sub, x, z, w, h, d, wall, roofCol, acts) {
    const g = new T.Group();
    const ft = facadeTextures(wall, Math.max(3, Math.round(w/2.6)), Math.max(2, Math.round(h/2.6)));
    const bodyMat = new T.MeshStandardMaterial({ map: ft.map, emissiveMap: ft.emissiveMap, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.82, metalness: 0.02 });
    const body = shad(box(w, h, d, bodyMat)); body.position.y = h/2; g.add(body);
    const roof = shad(box(w+0.8, 0.7, d+0.8, new T.MeshStandardMaterial({ color: roofCol, roughness: 0.7, flatShading: true })));
    roof.position.y = h + 0.35; g.add(roof);
    // entrance canopy + door
    const door = box(2.2, 2.6, 0.3, new T.MeshStandardMaterial({ color: 0x2a1c10, roughness: 0.8 }));
    door.position.set(0, 1.3, d/2 + 0.12); g.add(door);
    const canopy = shad(box(3.4, 0.3, 1.4, new T.MeshStandardMaterial({ color: roofCol, roughness: 0.7 })));
    canopy.position.set(0, 2.9, d/2 + 0.6); g.add(canopy);
    g.position.set(x, 0, z); scene.add(g);
    g.add(makeLabel(name, h + 2.2));
    const b = { name, sub, x, z, hx: w/2, hz: d/2, acts };
    buildings.push(b); solids.push(b);
  }
  function makeLabel(text, y) {
    const c = document.createElement("canvas"); c.width = 320; c.height = 72;
    const x = c.getContext("2d");
    x.fillStyle = "rgba(12,15,26,0.82)"; rr(x, 6, 10, 308, 52, 14); x.fill();
    x.strokeStyle = "rgba(150,170,255,0.5)"; x.lineWidth = 2; rr(x, 6, 10, 308, 52, 14); x.stroke();
    x.fillStyle = "#fff"; x.font = "bold 30px Segoe UI, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(text, 160, 38);
    const tx = new T.CanvasTexture(c); tx.anisotropy = MAXANI;
    const s = new T.Sprite(new T.SpriteMaterial({ map: tx, depthTest: false, transparent: true }));
    s.scale.set(7, 1.6, 1); s.position.y = y; return s;
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  makeBuilding("Library", "Quiet. Smells like exam season.", -22, -18, 13, 10, 11, "#7a6bb0", 0x3a3358, [
    { t: "Study", d: "Grades +9, Energy −16 · 3h", f: () => act({ grades: 9, energy: -16 }, 3, "Hit the books. Grades up!") },
    { t: "Group project", d: "Grades +5, Social +6, Energy −10 · 2h", f: () => act({ grades: 5, social: 6, energy: -10 }, 2, "Carried the group again.") },
    { t: "Nap in a corner", d: "Energy +12 · 1h", f: () => act({ energy: 12 }, 1, "Sneaky library nap.") },
  ]);
  makeBuilding("Lecture Hall", "300 seats. You sit in the back.", 0, -30, 19, 9, 10, "#5878b0", 0x2f3f60, [
    { t: "Attend class", d: "Grades +7, Energy −12 · 2h", f: () => act({ grades: 7, energy: -12 }, 2, "Actually paid attention.") },
    { t: "Skip & scroll", d: "Social +4, Grades −3 · 1h", f: () => act({ social: 4, grades: -3 }, 1, "Bunked. No regrets… yet.") },
  ]);
  makeBuilding("Dorm", "Your tiny kingdom.", 22, -18, 12, 9, 11, "#b07a52", 0x5a3f28, [
    { t: "Sleep till morning", d: "Energy → full · new day", f: () => sleep() },
    { t: "Chill / game", d: "Energy +8, Social +3 · 2h", f: () => act({ energy: 8, social: 3 }, 2, "Recharged the vibes.") },
  ]);
  makeBuilding("Gym", "Gains incoming.", -22, 20, 12, 8, 12, "#b05878", 0x5a2c3c, [
    { t: "Workout", d: "Health +12, Energy −14 · 2h", f: () => act({ health: 12, energy: -14 }, 2, "Leg day survived.") },
    { t: "Basketball", d: "Health +7, Social +7, Energy −12 · 2h", f: () => act({ health: 7, social: 7, energy: -12 }, 2, "Buzzer beater!") },
  ]);
  makeBuilding("Café", "Overpriced coffee HQ.", 22, 20, 11, 7, 11, "#4fae8a", 0x275446, [
    { t: "Eat a real meal", d: "Energy +18, Health +5, Money −10 · 1h", f: () => act({ energy: 18, health: 5, money: -10 }, 1, "Fed. Finally.") },
    { t: "Coffee & study", d: "Energy +8, Grades +4, Money −6 · 1h", f: () => act({ energy: 8, grades: 4, money: -6 }, 1, "Caffeinated genius mode.") },
  ]);
  makeBuilding("Student Union", "Where the chaos lives.", 0, 32, 17, 9, 11, "#c2a23f", 0x5f4f22, [
    { t: "Go to the party", d: "Social +16, Energy −18, Money −12 · 4h", f: () => act({ social: 16, energy: -18, money: -12 }, 4, "Legendary night.") },
    { t: "Part-time shift", d: "Money +25, Energy −16 · 4h", f: () => act({ money: 25, energy: -16 }, 4, "Clocked in. Cha-ching.") },
    { t: "Join a club", d: "Social +9, Grades +2 · 2h", f: () => act({ social: 9, grades: 2 }, 2, "New crew unlocked.") },
  ]);

  // ---------------- fountain (center) ----------------
  (function fountain() {
    const g = new T.Group();
    const stone = new T.MeshStandardMaterial({ color: 0xb9b3a4, roughness: 0.85, flatShading: true });
    const basin = shad(new T.Mesh(new T.CylinderGeometry(3.4, 3.7, 0.8, 20), stone)); basin.position.y = 0.4; g.add(basin);
    const rim = shad(new T.Mesh(new T.CylinderGeometry(3.5, 3.5, 0.25, 20), stone)); rim.position.y = 0.85; g.add(rim);
    const water = new T.Mesh(new T.CylinderGeometry(3.1, 3.1, 0.4, 20),
      new T.MeshStandardMaterial({ color: 0x4fb8f0, roughness: 0.2, metalness: 0.3, emissive: 0x1a4a6a, emissiveIntensity: 0.4, transparent: true, opacity: 0.9 }));
    water.position.y = 0.7; g.add(water);
    const col = shad(new T.Mesh(new T.CylinderGeometry(0.4, 0.6, 2.2, 12), stone)); col.position.y = 1.9; g.add(col);
    const top = shad(new T.Mesh(new T.CylinderGeometry(1.2, 1.4, 0.4, 16), stone)); top.position.y = 3.1; g.add(top);
    scene.add(g);
    solids.push({ x: 0, z: 0, hx: 3.7, hz: 3.7 });
  })();

  // ---------------- vegetation & props ----------------
  function nearSolid(x, z, pad) {
    for (const b of solids) if (Math.abs(x-b.x) < b.hx+pad && Math.abs(z-b.z) < b.hz+pad) return true;
    return false;
  }
  function makeTree(x, z) {
    const g = new T.Group();
    const trunk = shad(new T.Mesh(new T.CylinderGeometry(0.28, 0.4, 2.4, 6), new T.MeshStandardMaterial({ color: 0x7a5230, roughness: 1, flatShading: true })));
    trunk.position.y = 1.2; g.add(trunk);
    const green = new T.Color().setHSL(0.28 + Math.random()*0.06, 0.55, 0.4 + Math.random()*0.1);
    const fmat = new T.MeshStandardMaterial({ color: green, roughness: 1, flatShading: true });
    for (let i = 0; i < 3; i++) {
      const bl = shad(new T.Mesh(new T.IcosahedronGeometry(1.7 - i*0.35, 0), fmat));
      bl.position.set((Math.random()-0.5)*0.8, 3 + i*1.1, (Math.random()-0.5)*0.8);
      bl.rotation.set(Math.random(), Math.random(), Math.random()); g.add(bl);
    }
    g.position.set(x, 0, z); g.scale.setScalar(0.85 + Math.random()*0.5); scene.add(g);
  }
  function makeBush(x, z) {
    const m = new T.MeshStandardMaterial({ color: new T.Color().setHSL(0.3, 0.5, 0.38), roughness: 1, flatShading: true });
    const b = shad(new T.Mesh(new T.IcosahedronGeometry(0.8 + Math.random()*0.5, 0), m));
    b.position.set(x, 0.5, z); b.scale.y = 0.8; scene.add(b);
  }
  function makeBench(x, z, rot) {
    const g = new T.Group();
    const wood = new T.MeshStandardMaterial({ color: 0x8a5a34, roughness: 0.9, flatShading: true });
    const seat = shad(new T.Mesh(new T.BoxGeometry(2.4, 0.16, 0.7), wood)); seat.position.y = 0.55; g.add(seat);
    const back = shad(new T.Mesh(new T.BoxGeometry(2.4, 0.6, 0.14), wood)); back.position.set(0, 0.95, -0.28); g.add(back);
    for (const sx of [-1, 1]) { const leg = shad(new T.Mesh(new T.BoxGeometry(0.16, 0.55, 0.6), new T.MeshStandardMaterial({ color: 0x3a3f4a, roughness: 0.6, metalness: 0.4 }))); leg.position.set(sx*1, 0.27, 0); g.add(leg); }
    g.position.set(x, 0, z); g.rotation.y = rot || 0; scene.add(g);
  }
  function makeLamp(x, z) {
    const g = new T.Group();
    const pole = shad(new T.Mesh(new T.CylinderGeometry(0.13, 0.16, 4.2, 8), new T.MeshStandardMaterial({ color: 0x33384a, roughness: 0.5, metalness: 0.6 })));
    pole.position.y = 2.1; g.add(pole);
    const bulb = new T.Mesh(new T.SphereGeometry(0.4, 12, 12), new T.MeshStandardMaterial({ color: 0xfff2b0, emissive: 0xffdf7a, emissiveIntensity: 1.6 }));
    bulb.position.y = 4.3; g.add(bulb);
    g.position.set(x, 0, z); scene.add(g);
  }
  for (let i = 0; i < 30; i++) { let x=(Math.random()*2-1)*44, z=(Math.random()*2-1)*44; if (Math.abs(x)<6.5||Math.abs(z)<6.5) continue; if (nearSolid(x,z,4)) continue; makeTree(x,z); }
  for (let i = 0; i < 26; i++) { let x=(Math.random()*2-1)*46, z=(Math.random()*2-1)*46; if (nearSolid(x,z,2.5)) continue; makeBush(x,z); }
  for (let z = -34; z <= 34; z += 13) { makeLamp(6.4, z); makeLamp(-6.4, z); }
  makeBench(9, 8, -0.4); makeBench(-9, -8, 2.6); makeBench(9, -8, 3.5); makeBench(-9, 8, 0.6);

  // ---------------- people ----------------
  function makePerson(skin, shirt, pants, hair, isPlayer) {
    const g = new T.Group();
    const M = (c, r) => new T.MeshStandardMaterial({ color: c, roughness: r == null ? 0.62 : r, metalness: 0 });
    const sMat = M(skin, 0.6), shMat = M(shirt, 0.68), pMat = M(pants, 0.7), hMat = M(hair, 0.78);
    // limb: group pivoting at top; tapered cylinder + rounded joint & end
    function limb(rad, len, mat, endMat) {
      const grp = new T.Group();
      const cyl = shad(new T.Mesh(new T.CylinderGeometry(rad, rad * 0.88, len, 10), mat)); cyl.position.y = -len/2; grp.add(cyl);
      const top = shad(new T.Mesh(new T.SphereGeometry(rad, 10, 8), mat)); grp.add(top);
      const end = shad(new T.Mesh(new T.SphereGeometry(rad * 0.92, 10, 8), endMat || mat)); end.position.y = -len; grp.add(end);
      return grp;
    }
    const legL = limb(0.14, 0.9, pMat, pMat); legL.position.set(-0.17, 0.95, 0); g.add(legL);
    const legR = limb(0.14, 0.9, pMat, pMat); legR.position.set(0.17, 0.95, 0); g.add(legR);
    function foot(p) { const f = shad(new T.Mesh(new T.BoxGeometry(0.2, 0.14, 0.34), M(0x2a2a30, 0.6))); f.position.set(0, -0.9, 0.07); p.add(f); }
    foot(legL); foot(legR);
    const hips = shad(new T.Mesh(new T.SphereGeometry(0.28, 14, 10), pMat)); hips.position.y = 0.98; hips.scale.set(1, 0.72, 0.9); g.add(hips);
    const torso = shad(new T.Mesh(new T.CylinderGeometry(0.33, 0.27, 0.6, 14), shMat)); torso.position.y = 1.28; g.add(torso);
    const chest = shad(new T.Mesh(new T.SphereGeometry(0.33, 16, 12), shMat)); chest.position.y = 1.56; chest.scale.set(1, 0.68, 0.86); g.add(chest);
    const armL = limb(0.1, 0.6, shMat, sMat); armL.position.set(-0.4, 1.54, 0); g.add(armL);
    const armR = limb(0.1, 0.6, shMat, sMat); armR.position.set(0.4, 1.54, 0); g.add(armR);
    const neck = shad(new T.Mesh(new T.CylinderGeometry(0.11, 0.11, 0.12, 8), sMat)); neck.position.y = 1.72; g.add(neck);
    const head = shad(new T.Mesh(new T.SphereGeometry(0.28, 18, 14), sMat)); head.position.y = 1.96; head.scale.set(1, 1.06, 1); g.add(head);
    const hairMesh = shad(new T.Mesh(new T.SphereGeometry(0.3, 18, 14, 0, Math.PI*2, 0, Math.PI*0.62), hMat)); hairMesh.position.y = 1.98; g.add(hairMesh);
    for (const ex of [-0.1, 0.1]) { const eye = new T.Mesh(new T.SphereGeometry(0.04, 8, 8), new T.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.4 })); eye.position.set(ex, 1.99, 0.25); g.add(eye); }
    if (isPlayer) { const bp = shad(new T.Mesh(new T.BoxGeometry(0.44, 0.52, 0.22), M(0xe23b5b, 0.7))); bp.position.set(0, 1.3, -0.33); g.add(bp); }
    return { g, legL, legR, armL, armR, phase: Math.random()*6 };
  }
  function animate(p, moving, dt) {
    p.phase += dt * (moving ? 9 : 2);
    const s = Math.sin(p.phase) * (moving ? 0.62 : 0.04);
    p.legL.rotation.x = s; p.legR.rotation.x = -s; p.armL.rotation.x = -s; p.armR.rotation.x = s;
  }
  const player = makePerson(0xf0c090, 0x2f6df0, 0x27324a, 0x2a2018, true);
  scene.add(player.g);
  const pos = new T.Vector3(0, 0, 12);
  let facing = Math.PI;

  const npcs = [];
  const palette = [[0xf0c090,0xe0553a,0x333,0x201810],[0xd9a066,0x36b37e,0x2b2b3a,0x120e0a],[0xf5cda0,0xf2b807,0x3a2f2f,0x30240f],[0xe8b98a,0x8a5cf5,0x222,0x1a1410],[0xf0c090,0x00b4d8,0x333,0x27201a],[0xd9a066,0xff6ea8,0x2a2a3a,0x161010]];
  for (let i = 0; i < 16; i++) {
    const c = palette[i % palette.length];
    const p = makePerson(c[0], c[1], c[2], c[3]);
    p.g.position.set((Math.random()*2-1)*38, 0, (Math.random()*2-1)*38);
    p.target = randTarget(); p.speed = 1.5 + Math.random()*1.3;
    scene.add(p.g); npcs.push(p);
  }
  function randTarget() { let x,z,t=0; do { x=(Math.random()*2-1)*40; z=(Math.random()*2-1)*40; t++; } while (nearSolid(x,z,2) && t<10); return new T.Vector3(x,0,z); }

  // ---------------- atmospheric dust motes ----------------
  const dustGeo = new T.BufferGeometry();
  const DN = 340, darr = new Float32Array(DN * 3);
  for (let i = 0; i < DN; i++) { darr[i*3] = (Math.random()*2-1)*60; darr[i*3+1] = Math.random()*22; darr[i*3+2] = (Math.random()*2-1)*60; }
  dustGeo.setAttribute("position", new T.BufferAttribute(darr, 3));
  const dust = new T.Points(dustGeo, new T.PointsMaterial({ color: 0xfff4d0, size: 0.09, transparent: true, opacity: 0.5, depthWrite: false, blending: T.AdditiveBlending }));
  scene.add(dust);

  // ---------------- camera ----------------
  let camYaw = Math.PI, camPitch = 0.42, camDist = 11;
  let dragging = false, lx = 0, ly = 0;
  const cvs = renderer.domElement;
  cvs.addEventListener("mousedown", e => { dragging = true; lx = e.clientX; ly = e.clientY; });
  addEventListener("mouseup", () => dragging = false);
  addEventListener("mousemove", e => { if (!dragging) return; camYaw -= (e.clientX-lx)*0.005; camPitch = clamp(camPitch+(e.clientY-ly)*0.004, 0.12, 1.15); lx = e.clientX; ly = e.clientY; });
  cvs.addEventListener("wheel", e => { camDist = clamp(camDist + e.deltaY*0.01, 5, 22); e.preventDefault(); }, { passive: false });

  // ---------------- keys ----------------
  const keys = {};
  addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "KeyE") tryEnter(); if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault(); });
  addEventListener("keyup", e => keys[e.code] = false);

  // ---------------- touch ----------------
  const stick = document.getElementById("stick"), nub = stick.querySelector(".nub");
  let joyId = null, joyX = 0, joyY = 0, jcx = 0, jcy = 0, lookId = null, llx = 0, lly = 0;
  const isTouch = matchMedia("(pointer: coarse)").matches;
  addEventListener("touchstart", e => {
    for (const t of e.changedTouches) {
      if (t.clientX < innerWidth/2 && joyId === null) { joyId = t.identifier; jcx = t.clientX; jcy = t.clientY; stick.style.display = "block"; stick.style.left = (jcx-60)+"px"; stick.style.top = (jcy-60)+"px"; nub.style.left = "50%"; nub.style.top = "50%"; }
      else if (lookId === null) { lookId = t.identifier; llx = t.clientX; lly = t.clientY; }
    }
  }, { passive: false });
  addEventListener("touchmove", e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) { let dx = t.clientX-jcx, dy = t.clientY-jcy; const l = Math.hypot(dx,dy), m = 45; if (l>m){dx=dx/l*m;dy=dy/l*m;} joyX = dx/m; joyY = dy/m; nub.style.left = (60+dx)+"px"; nub.style.top = (60+dy)+"px"; }
      else if (t.identifier === lookId) { camYaw -= (t.clientX-llx)*0.006; camPitch = clamp(camPitch+(t.clientY-lly)*0.005, 0.12, 1.15); llx = t.clientX; lly = t.clientY; }
    }
    e.preventDefault();
  }, { passive: false });
  addEventListener("touchend", e => { for (const t of e.changedTouches) { if (t.identifier === joyId) { joyId = null; joyX = joyY = 0; stick.style.display = "none"; } if (t.identifier === lookId) lookId = null; } });

  // ---------------- stats ----------------
  const stats = { energy: 80, grades: 20, social: 30, health: 60, money: 40 };
  let day = 1, hour = 8;
  function refresh() { for (const k in stats) { stats[k] = clamp(stats[k], 0, 100); const el = document.getElementById("f-"+k); if (el) el.style.width = stats[k]+"%"; } document.getElementById("clock").textContent = "Day "+day+" · "+String(hour).padStart(2,"0")+":00"; }
  function adv(h) { hour += h; while (hour >= 24) { hour -= 24; day++; stats.energy = clamp(stats.energy-6,0,100); } }
  function act(delta, hours, msg) { for (const k in delta) stats[k] = clamp((stats[k]||0)+delta[k],0,100); adv(hours||1); refresh(); toast(msg); closePanel(); }
  function sleep() { stats.energy = 100; day++; hour = 8; refresh(); toast("😴 Slept like a rock. New day!"); closePanel(); }
  let tt = null;
  function toast(m) { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2200); }

  // ---------------- panel ----------------
  const panel = document.getElementById("panel");
  let nearB = null;
  function tryEnter() {
    if (panel.style.display === "flex") { closePanel(); return; }
    if (!nearB) return;
    document.getElementById("p-title").textContent = nearB.name;
    document.getElementById("p-sub").textContent = nearB.sub;
    const w = document.getElementById("p-acts"); w.innerHTML = "";
    for (const a of nearB.acts) { const b = document.createElement("button"); b.className = "act"; b.innerHTML = a.t+"<small>"+a.d+"</small>"; b.onclick = a.f; w.appendChild(b); }
    panel.style.display = "flex";
  }
  function closePanel() { panel.style.display = "none"; }
  document.getElementById("p-close").onclick = closePanel;
  panel.addEventListener("click", e => { if (e.target === panel) closePanel(); });

  // ---------------- collision ----------------
  function resolve(p, radius) {
    for (const b of solids) {
      const minx = b.x-b.hx-radius, maxx = b.x+b.hx+radius, minz = b.z-b.hz-radius, maxz = b.z+b.hz+radius;
      if (p.x>minx && p.x<maxx && p.z>minz && p.z<maxz) {
        const dl = p.x-minx, dr = maxx-p.x, dt = p.z-minz, db = maxz-p.z, m = Math.min(dl,dr,dt,db);
        if (m===dl) p.x=minx; else if (m===dr) p.x=maxx; else if (m===dt) p.z=minz; else p.z=maxz;
      }
    }
    p.x = clamp(p.x, -48, 48); p.z = clamp(p.z, -48, 48);
  }

  // ---------------- loop ----------------
  const clock = new T.Clock();
  const promptEl = document.getElementById("prompt");
  if (isTouch) document.getElementById("hint").textContent = "Left · move   ·   Right · look   ·   tap prompt to enter";

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    let inF = 0, inR = 0;
    if (keys["KeyW"]||keys["ArrowUp"]) inF += 1;
    if (keys["KeyS"]||keys["ArrowDown"]) inF -= 1;
    if (keys["KeyD"]||keys["ArrowRight"]) inR += 1;
    if (keys["KeyA"]||keys["ArrowLeft"]) inR -= 1;
    if (joyX||joyY) { inR += joyX; inF -= joyY; }
    const fwd = new T.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
    const right = new T.Vector3(fwd.z, 0, -fwd.x);
    const move = new T.Vector3().addScaledVector(fwd, inF).addScaledVector(right, inR);
    const moving = move.lengthSq() > 0.001 && panel.style.display !== "flex";
    if (moving) { move.normalize(); const run = keys["ShiftLeft"]||keys["ShiftRight"]; pos.addScaledVector(move, (run?9:5)*dt); resolve(pos, 0.6); facing = Math.atan2(move.x, move.z); }
    player.g.position.copy(pos);
    let d = facing - player.g.rotation.y; while (d>Math.PI) d -= 6.283; while (d<-Math.PI) d += 6.283;
    player.g.rotation.y += d * Math.min(dt*12, 1);
    animate(player, moving, dt);

    for (const n of npcs) {
      const to = new T.Vector3().subVectors(n.target, n.g.position); to.y = 0; const dd = to.length();
      if (dd < 1) n.target = randTarget();
      else { to.normalize(); n.g.position.addScaledVector(to, n.speed*dt); resolve(n.g.position, 0.5); n.g.rotation.y = Math.atan2(to.x, to.z); }
      animate(n, dd >= 1, dt);
    }
    for (const c of clouds) { c.position.x += dt * 1.2; if (c.position.x > 170) c.position.x = -170; }
    dust.rotation.y += dt * 0.03; dust.position.y = Math.sin(clock.elapsedTime * 0.2) * 0.5;

    nearB = null; let best = 6;
    for (const b of buildings) { const dx = Math.max(Math.abs(pos.x-b.x)-b.hx,0), dz = Math.max(Math.abs(pos.z-b.z)-b.hz,0), dd = Math.hypot(dx,dz); if (dd<best){best=dd;nearB=b;} }
    if (nearB && panel.style.display !== "flex") { promptEl.style.display = "block"; promptEl.innerHTML = "Press <b>E</b> to enter "+nearB.name; }
    else promptEl.style.display = "none";

    const target = new T.Vector3(pos.x, pos.y+1.7, pos.z);
    const off = new T.Vector3(Math.sin(camYaw)*Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw)*Math.cos(camPitch)).multiplyScalar(camDist);
    camera.position.lerp(new T.Vector3().addVectors(target, off), Math.min(dt*10, 1));
    camera.lookAt(target);

    composer.render();
    requestAnimationFrame(frame);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
    bloom.resolution.set(innerWidth, innerHeight); setFXAA();
  });

  refresh();
  document.getElementById("loading").style.display = "none";
  frame();
})();
</script>
</body>
</html>
