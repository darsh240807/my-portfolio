<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>GOAL HERO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a1420; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; pointer-events: none; }
  .pill { background: rgba(8,16,26,0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.14); border-radius: 30px; padding: 8px 16px; font-weight: 800; letter-spacing: .5px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #level { font-size: 15px; color: #cfe0ff; }
  #stars { font-size: 18px; letter-spacing: 2px; }
  #banner { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; pointer-events: none; }
  #banner .big { font-size: clamp(48px, 14vw, 130px); font-weight: 900; letter-spacing: 3px; text-shadow: 0 8px 34px rgba(0,0,0,.6); transform: scale(.4); opacity: 0; }
  #banner.show .big { animation: pop .5s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes pop { to { transform: scale(1); opacity: 1; } }
  #banner .sub { font-size: 18px; color: #dfe8ff; opacity: 0; }
  #banner.show .sub { animation: fin .4s ease .35s forwards; }
  @keyframes fin { to { opacity: 1; } }
  #cta { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 21; display: none; gap: 12px; }
  #cta button { pointer-events: auto; border: none; border-radius: 40px; padding: 15px 34px; font-size: 17px; font-weight: 800; letter-spacing: .5px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: transform .12s; }
  #cta button:active { transform: scale(.95); }
  .btn-go { background: linear-gradient(135deg,#3ee07a,#12b45a); color: #04140a; }
  .btn-retry { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.25) !important; }
  #hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9; font-size: 13px; color: #a9bcd8; letter-spacing: .5px; background: rgba(8,16,26,0.5); padding: 8px 16px; border-radius: 20px; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; background: #0a1420; color: #8fa6c4; font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">Loading pitch…</div>
<div id="top">
  <div class="pill" id="level">LEVEL 1</div>
  <div class="pill" id="stars">☆☆☆</div>
</div>
<div id="banner"><div class="big" id="bannerBig">GOAL!</div><div class="sub" id="bannerSub"></div></div>
<div id="cta">
  <button class="btn-retry" id="btnRetry">Retry</button>
  <button class="btn-go" id="btnNext">Next ▶</button>
</div>
<div id="hint">Drag from the ball to curve your shot — bend it around defenders, aim for the corners</div>

<script>/*__THREE__*/</script>
<script>
(() => {
  "use strict";
  if (!window.THREE) { document.getElementById("loading").textContent = "Failed to load 3D engine."; return; }
  const T = window.THREE;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // ---------- renderer ----------
  const app = document.getElementById("app");
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  app.appendChild(renderer.domElement);
  const ANI = renderer.capabilities.getMaxAnisotropy();

  const scene = new T.Scene();
  scene.background = new T.Color(0x1a3a5c);
  scene.fog = new T.Fog(0x1a3a5c, 60, 130);
  const camera = new T.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 400);

  // ---------- lights ----------
  scene.add(new T.HemisphereLight(0xdff0ff, 0x2e5c30, 0.75));
  const sun = new T.DirectionalLight(0xffffff, 1.7);
  sun.position.set(20, 50, 30); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -40; sun.shadow.camera.right = 40; sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 140; sun.shadow.bias = -0.0004;
  scene.add(sun);

  // ---------- geometry constants ----------
  const GOAL_Z = -30, GOAL_W = 4.2, GOAL_H = 3.0, POST_R = 0.13;

  // ---------- pitch ----------
  function pitchTexture() {
    const S = 1024, c = document.createElement("canvas"); c.width = c.height = S;
    const x = c.getContext("2d");
    // mow stripes along z (horizontal bands here)
    const bands = 14;
    for (let i = 0; i < bands; i++) { x.fillStyle = i % 2 ? "#3f9a44" : "#379040"; x.fillRect(0, i*S/bands, S, S/bands); }
    // subtle noise
    for (let i = 0; i < 5000; i++) { x.fillStyle = `rgba(255,255,255,${Math.random()*0.03})`; x.fillRect(Math.random()*S, Math.random()*S, 2, 2); }
    const t = new T.CanvasTexture(c); t.anisotropy = ANI; t.encoding = T.sRGBEncoding; t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
    return t;
  }
  const pitch = new T.Mesh(new T.PlaneGeometry(80, 90), new T.MeshStandardMaterial({ map: pitchTexture(), roughness: 1 }));
  pitch.rotation.x = -Math.PI / 2; pitch.position.z = -8; pitch.receiveShadow = true; scene.add(pitch);

  // white line markings (attacking third) via thin boxes
  const lineMat = new T.MeshBasicMaterial({ color: 0xffffff });
  function line(w, d, x, z) { const m = new T.Mesh(new T.BoxGeometry(w, 0.02, d), lineMat); m.position.set(x, 0.02, z); scene.add(m); }
  const lw = 0.16;
  line(80, lw, 0, GOAL_Z);                 // goal line
  line(24, lw, 0, GOAL_Z + 16.5);          // penalty box front
  line(lw, 16.5, -12, GOAL_Z + 8.25); line(lw, 16.5, 12, GOAL_Z + 8.25); // box sides
  line(11, lw, 0, GOAL_Z + 5.5);           // 6-yard front
  line(lw, 5.5, -5.5, GOAL_Z + 2.75); line(lw, 5.5, 5.5, GOAL_Z + 2.75);
  // penalty arc
  (function arc() {
    const pts = []; for (let a = -0.9; a <= 0.9; a += 0.1) pts.push(new T.Vector3(Math.sin(a)*7.3, 0.02, GOAL_Z + 11 - Math.cos(a)*7.3));
    const g = new T.BufferGeometry().setFromPoints(pts);
    scene.add(new T.Line(g, new T.LineBasicMaterial({ color: 0xffffff })));
  })();
  // penalty spot
  const spot = new T.Mesh(new T.CircleGeometry(0.22, 16), lineMat); spot.rotation.x = -Math.PI/2; spot.position.set(0, 0.02, GOAL_Z + 11); scene.add(spot);

  // ---------- goal (posts + net) ----------
  (function goal() {
    const g = new T.Group();
    const pm = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
    const post = () => { const p = new T.Mesh(new T.CylinderGeometry(POST_R, POST_R, GOAL_H, 12), pm); p.castShadow = true; return p; };
    const pL = post(); pL.position.set(-GOAL_W, GOAL_H/2, GOAL_Z); g.add(pL);
    const pR = post(); pR.position.set(GOAL_W, GOAL_H/2, GOAL_Z); g.add(pR);
    const bar = new T.Mesh(new T.CylinderGeometry(POST_R, POST_R, GOAL_W*2 + POST_R*2, 12), pm);
    bar.rotation.z = Math.PI/2; bar.position.set(0, GOAL_H, GOAL_Z); bar.castShadow = true; g.add(bar);
    // net texture
    const nc = document.createElement("canvas"); nc.width = nc.height = 128; const nx = nc.getContext("2d");
    nx.clearRect(0,0,128,128); nx.strokeStyle = "rgba(255,255,255,0.5)"; nx.lineWidth = 2;
    for (let i = 0; i <= 128; i += 12) { nx.beginPath(); nx.moveTo(i,0); nx.lineTo(i,128); nx.stroke(); nx.beginPath(); nx.moveTo(0,i); nx.lineTo(128,i); nx.stroke(); }
    const nt = new T.CanvasTexture(nc); nt.wrapS = nt.wrapT = T.RepeatWrapping;
    const netMat = new T.MeshStandardMaterial({ map: nt, transparent: true, alphaTest: 0.02, opacity: 0.85, side: T.DoubleSide, roughness: 1 });
    const back = new T.Mesh(new T.PlaneGeometry(GOAL_W*2, GOAL_H), netMat.clone()); back.material.map = nt.clone(); back.material.map.repeat.set(6,3); back.material.map.needsUpdate = true;
    back.position.set(0, GOAL_H/2, GOAL_Z - 1.8); g.add(back);
    const top = new T.Mesh(new T.PlaneGeometry(GOAL_W*2, 1.8), netMat.clone()); top.material.map = nt.clone(); top.material.map.repeat.set(6,2); top.material.map.needsUpdate = true;
    top.rotation.x = -Math.PI/2; top.position.set(0, GOAL_H, GOAL_Z - 0.9); g.add(top);
    for (const sx of [-1, 1]) { const s = new T.Mesh(new T.PlaneGeometry(1.8, GOAL_H), netMat.clone()); s.material.map = nt.clone(); s.material.map.repeat.set(2,3); s.material.map.needsUpdate = true; s.rotation.y = Math.PI/2; s.position.set(sx*GOAL_W, GOAL_H/2, GOAL_Z - 0.9); g.add(s); }
    scene.add(g);
  })();

  // ---------- stands (crowd) ----------
  (function stands() {
    const cc = document.createElement("canvas"); cc.width = cc.height = 128; const cx = cc.getContext("2d");
    cx.fillStyle = "#20304a"; cx.fillRect(0,0,128,128);
    for (let i = 0; i < 900; i++) { cx.fillStyle = `hsl(${Math.random()*360},${40+Math.random()*40}%,${45+Math.random()*30}%)`; cx.fillRect(Math.random()*128, Math.random()*128, 3, 3); }
    const ct = new T.CanvasTexture(cc); ct.wrapS = ct.wrapT = T.RepeatWrapping; ct.repeat.set(10, 3); ct.encoding = T.sRGBEncoding;
    const sm = new T.MeshStandardMaterial({ map: ct, roughness: 1 });
    const back = new T.Mesh(new T.BoxGeometry(90, 14, 6), sm); back.position.set(0, 7, GOAL_Z - 8); scene.add(back);
    const sideMat = new T.MeshStandardMaterial({ map: ct.clone(), roughness: 1 }); sideMat.map.repeat.set(12,3);
    for (const sx of [-1, 1]) { const s = new T.Mesh(new T.BoxGeometry(6, 12, 80), sideMat); s.position.set(sx*44, 6, -8); scene.add(s); }
  })();

  // ---------- ball ----------
  function ballTexture() {
    const S = 128, c = document.createElement("canvas"); c.width = c.height = S; const x = c.getContext("2d");
    x.fillStyle = "#ffffff"; x.fillRect(0,0,S,S);
    x.fillStyle = "#15181f";
    for (let i = 0; i < 12; i++) { const px = Math.random()*S, py = Math.random()*S, r = 8 + Math.random()*7; x.beginPath(); for (let k=0;k<5;k++){ const a=k/5*Math.PI*2; x.lineTo(px+Math.cos(a)*r, py+Math.sin(a)*r);} x.closePath(); x.fill(); }
    const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return t;
  }
  const ball = new T.Mesh(new T.SphereGeometry(0.45, 24, 18), new T.MeshStandardMaterial({ map: ballTexture(), roughness: 0.55 }));
  ball.castShadow = true; scene.add(ball);
  const ballShadow = new T.Mesh(new T.CircleGeometry(0.45, 16), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
  ballShadow.rotation.x = -Math.PI/2; scene.add(ballShadow);

  // ---------- people ----------
  function footballer(kit, shorts, skin, hair) {
    const g = new T.Group();
    const M = (c, r) => new T.MeshStandardMaterial({ color: c, roughness: r == null ? 0.7 : r });
    const km = M(kit), sm = M(shorts), skm = M(skin, 0.6), hm = M(hair, 0.8);
    function limb(rad, len, mat, px, py) { const grp = new T.Group(); const cyl = new T.Mesh(new T.CylinderGeometry(rad, rad*0.9, len, 8), mat); cyl.position.y = -len/2; cyl.castShadow = true; grp.add(cyl); const e = new T.Mesh(new T.SphereGeometry(rad, 8, 6), mat); e.position.y = -len; grp.add(e); grp.position.set(px, py, 0); g.add(grp); return grp; }
    const legL = limb(0.11, 0.62, sm, -0.13, 0.68), legR = limb(0.11, 0.62, sm, 0.13, 0.68);
    const torso = new T.Mesh(new T.CylinderGeometry(0.26, 0.22, 0.55, 12), km); torso.position.y = 0.98; torso.castShadow = true; g.add(torso);
    const chest = new T.Mesh(new T.SphereGeometry(0.26, 12, 10), km); chest.position.y = 1.22; chest.scale.set(1,0.7,0.8); g.add(chest);
    const armL = limb(0.08, 0.5, km, -0.31, 1.2), armR = limb(0.08, 0.5, km, 0.31, 1.2);
    const head = new T.Mesh(new T.SphereGeometry(0.22, 16, 12), skm); head.position.y = 1.62; head.castShadow = true; g.add(head);
    const hairM = new T.Mesh(new T.SphereGeometry(0.235, 16, 12, 0, 6.3, 0, 1.9), hm); hairM.position.y = 1.64; g.add(hairM);
    return { g, legL, legR, armL, armR, phase: Math.random()*6 };
  }
  const skins = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0xffdbac];
  const hairs = [0x1a1109, 0x3a2416, 0x6b4a2b, 0x111111, 0x2b2b2b];

  const hero = footballer(0x2f6df0, 0xffffff, skins[0], hairs[0]);
  scene.add(hero.g);
  let keeper = null;
  let defenders = [];

  // ---------- aim line ----------
  let aimMesh = null, arrow = null;
  function clearAim() { if (aimMesh) { scene.remove(aimMesh); aimMesh.geometry.dispose(); aimMesh = null; } if (arrow) { scene.remove(arrow); arrow = null; } }
  const aimMat = new T.MeshBasicMaterial({ color: 0xffffff });
  function drawAim(pts) {
    clearAim();
    if (pts.length < 2) return;
    const curve = new T.CatmullRomCurve3(pts);
    const geo = new T.TubeGeometry(curve, Math.min(60, pts.length*4), 0.14, 6, false);
    aimMesh = new T.Mesh(geo, aimMat); scene.add(aimMesh);
    const end = pts[pts.length-1], prev = pts[pts.length-2];
    const dir = new T.Vector3().subVectors(end, prev).setY(0).normalize();
    arrow = new T.Mesh(new T.ConeGeometry(0.42, 1.0, 10), aimMat);
    arrow.position.copy(end).add(dir.clone().multiplyScalar(0.4)); arrow.position.y = 0.14;
    arrow.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), dir);
    scene.add(arrow);
  }

  // ---------- input (draw shot) ----------
  const groundPlane = new T.Plane(new T.Vector3(0,1,0), 0);
  const ray = new T.Raycaster();
  function toGround(cx, cy) {
    const ndc = new T.Vector2((cx/innerWidth)*2-1, -(cy/innerHeight)*2+1);
    ray.setFromCamera(ndc, camera);
    const p = new T.Vector3();
    ray.ray.intersectPlane(groundPlane, p);
    return p;
  }
  let drawing = false, strokePts = [], state = "aim"; // aim | flying | done
  function pointerDown(cx, cy) {
    if (state !== "aim") return;
    drawing = true; strokePts = [ball.position.clone().setY(0.14)];
  }
  function pointerMove(cx, cy) {
    if (!drawing) return;
    const p = toGround(cx, cy); if (!p) return; p.y = 0.14;
    const last = strokePts[strokePts.length-1];
    if (p.distanceTo(last) > 0.6) { strokePts.push(p); if (strokePts.length > 40) strokePts.shift(); drawAim(strokePts); }
  }
  function pointerUp() {
    if (!drawing) return; drawing = false;
    if (strokePts.length < 2) { clearAim(); return; }
    shoot(strokePts.slice());
  }
  const cvs = renderer.domElement;
  cvs.addEventListener("mousedown", e => pointerDown(e.clientX, e.clientY));
  addEventListener("mousemove", e => pointerMove(e.clientX, e.clientY));
  addEventListener("mouseup", pointerUp);
  cvs.addEventListener("touchstart", e => { const t = e.touches[0]; pointerDown(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  addEventListener("touchmove", e => { const t = e.touches[0]; pointerMove(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  addEventListener("touchend", e => { pointerUp(); e.preventDefault(); }, { passive: false });

  // ---------- audio ----------
  let AC = null; const ai = () => { if (!AC) try { AC = new (AudioContext||webkitAudioContext)(); } catch(e){} };
  function tone(f, d, ty, v, to) { if (!AC) return; try { const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = ty||"sine"; o.frequency.setValueAtTime(f,t); if (to) o.frequency.exponentialRampToValueAtTime(to, t+d); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v||.2,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);} catch(e){} }
  function crowd() { if (!AC) return; try { const t=AC.currentTime, b=AC.createBuffer(1, AC.sampleRate*1.2, AC.sampleRate), d=b.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.min(1,i/8000)*Math.max(0,1-i/d.length); const s=AC.createBufferSource(); s.buffer=b; const g=AC.createGain(); g.gain.value=0.5; const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); } catch(e){} }

  // ---------- ball flight ----------
  let flight = null;
  function shoot(pts) {
    ai();
    clearAim();
    state = "flying";
    // extend the path a bit beyond the last point toward its own direction so it reaches the goal line
    const end = pts[pts.length-1], prev = pts[pts.length-2];
    const dir = new T.Vector3().subVectors(end, prev).setY(0).normalize();
    let ext = end.clone();
    for (let i = 0; i < 6; i++) { ext = ext.clone().add(dir.clone().multiplyScalar(3)); pts.push(ext.clone().setY(0.14)); if (ext.z < GOAL_Z - 2) break; }
    const curve = new T.CatmullRomCurve3(pts);
    const len = curve.getLength();
    flight = { curve, len, t: 0, speed: 26, loft: clamp(len*0.02, 0.4, 1.1), done: false, intercepted: false, crossX: null };
    tone(150, 0.12, "square", 0.25, 60); // kick
    hero.legR.rotation.x = -1.1; // kick pose
  }

  function endShot(win, msg) {
    state = "done";
    document.getElementById("cta").style.display = "flex";
    document.getElementById("btnNext").style.display = win ? "block" : "none";
    const b = document.getElementById("banner"), big = document.getElementById("bannerBig"), sub = document.getElementById("bannerSub");
    big.textContent = win ? "GOAL!" : "MISS";
    big.style.color = win ? "#3ee07a" : "#ff5b6e";
    sub.textContent = msg || "";
    b.style.display = "flex"; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
    if (win) { crowd(); starsEl(3); shake = 12; confetti(); } else { tone(200,0.4,"sawtooth",0.2,80); }
  }
  function starsEl(n) { document.getElementById("stars").textContent = "★★★☆☆☆".slice(3-n, 6-n); }

  // confetti
  let confs = [];
  function confetti() {
    for (let i = 0; i < 90; i++) {
      const m = new T.Mesh(new T.PlaneGeometry(0.3, 0.3), new T.MeshBasicMaterial({ color: new T.Color().setHSL(Math.random(), 0.8, 0.6), side: T.DoubleSide }));
      m.position.set(rand(-GOAL_W, GOAL_W), GOAL_H + rand(0,2), GOAL_Z + rand(-1,1));
      m.userData = { v: new T.Vector3(rand(-2,2), rand(1,5), rand(1,4)), spin: rand(-6,6) };
      scene.add(m); confs.push(m);
    }
  }

  // ---------- levels ----------
  let level = 1;
  function buildLevel(n) {
    // reset ball & hero
    const bz = clamp(GOAL_Z + 13 + n*0.6, GOAL_Z + 13, GOAL_Z + 24);
    ball.position.set(0, 0.45, bz);
    hero.g.position.set(0.9, 0, bz + 1.2); hero.g.rotation.y = Math.PI; hero.legR.rotation.x = 0;
    // keeper
    if (keeper) scene.remove(keeper.g);
    keeper = footballer(0x2fe0b0, 0x14202e, skins[2], hairs[2]);
    keeper.g.position.set(0, 0, GOAL_Z + 0.6); keeper.g.rotation.y = Math.PI;
    keeper.cover = clamp(1.0 + n*0.22, 1.0, 3.1); keeper.x = 0;
    scene.add(keeper.g);
    // defenders (wall)
    for (const d of defenders) scene.remove(d.g);
    defenders = [];
    const count = clamp(n - 1, 0, 5);
    const wallZ = GOAL_Z + 8 + (n % 2) * 2;
    const spread = Math.min(count * 1.5, 7);
    for (let i = 0; i < count; i++) {
      const d = footballer(0xe23b3b, 0x2a2a2a, skins[(i+1)%skins.length], hairs[(i+2)%hairs.length]);
      const dx = count === 1 ? rand(-2,2) : -spread/2 + (spread/(count-1))*i + rand(-0.4,0.4);
      d.g.position.set(dx, 0, wallZ - (i%2)*1.2); d.g.rotation.y = 0;
      scene.add(d.g); defenders.push(d);
    }
    document.getElementById("level").textContent = "LEVEL " + n;
    starsEl(0);
    document.getElementById("cta").style.display = "none";
    document.getElementById("banner").style.display = "none";
    state = "aim"; flight = null; clearAim();
    // camera
    camAim.set(0, 1.4, GOAL_Z + 4);
    camPos.set(0, 9.5, bz + 12);
  }

  document.getElementById("btnNext").onclick = () => { level++; buildLevel(level); };
  document.getElementById("btnRetry").onclick = () => buildLevel(level);

  // ---------- camera ----------
  const camPos = new T.Vector3(0, 9.5, 0), camAim = new T.Vector3(0, 1.4, GOAL_Z + 4);

  // ---------- loop ----------
  let shake = 0;
  const clock = new T.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);

    // idle limb sway for keeper/defenders
    const tt = clock.elapsedTime;
    if (keeper) { keeper.armL.rotation.z = 0.5 + Math.sin(tt*3)*0.1; keeper.armR.rotation.z = -0.5 - Math.sin(tt*3)*0.1; }

    if (flight && state === "flying") {
      flight.t += (flight.speed * dt) / flight.len;
      const p = clamp(flight.t, 0, 1);
      const pos = flight.curve.getPointAt(p);
      pos.y = 0.45 + Math.sin(p * Math.PI) * flight.loft;
      ball.position.copy(pos);
      ball.rotation.x -= dt * 8; ball.rotation.z += dt * 5;

      // defender interception
      if (!flight.done) for (const d of defenders) {
        const dx = ball.position.x - d.g.position.x, dz = ball.position.z - d.g.position.z;
        if (Math.hypot(dx, dz) < 1.15 && ball.position.y < 2.0) { flight.done = true; endShot(false, "Blocked by the defender!"); tone(120,0.2,"square",0.2); break; }
      }
      // keeper dive toward crossing
      if (keeper && ball.position.z < GOAL_Z + 6) {
        const target = clamp(ball.position.x, -keeper.cover, keeper.cover);
        keeper.x += clamp(target - keeper.x, -dt*9, dt*9);
        keeper.g.position.x = keeper.x;
        keeper.g.rotation.z = clamp((keeper.x)*-0.15, -0.6, 0.6);
      }
      // crossing goal line
      if (!flight.done && ball.position.z <= GOAL_Z + 0.3) {
        flight.done = true;
        const inPosts = Math.abs(ball.position.x) < GOAL_W - 0.2 && ball.position.y < GOAL_H - 0.1;
        const saved = keeper && Math.abs(ball.position.x - keeper.x) < 1.1 && ball.position.y < 2.2;
        if (inPosts && !saved) endShot(true, "Top bins! ⚽");
        else if (saved) endShot(false, "Saved by the keeper!");
        else endShot(false, ball.position.y >= GOAL_H - 0.1 ? "Over the bar!" : "Just wide!");
      }
      if (p >= 1 && !flight.done) { flight.done = true; endShot(false, "Not enough on it!"); }
    }

    // ball shadow follows
    ballShadow.position.set(ball.position.x, 0.03, ball.position.z);
    const sc = clamp(1 - (ball.position.y-0.45)*0.15, 0.4, 1); ballShadow.scale.set(sc, sc, sc);

    // confetti physics
    for (let i = confs.length-1; i >= 0; i--) { const m = confs[i]; m.userData.v.y -= dt*9; m.position.addScaledVector(m.userData.v, dt); m.rotation.z += m.userData.spin*dt; m.rotation.x += dt*3; if (m.position.y < 0) { scene.remove(m); confs.splice(i,1); } }

    // camera
    let ox = 0, oy = 0; if (shake > 0.1) { ox = rand(-shake,shake)*0.05; oy = rand(-shake,shake)*0.05; shake -= dt*30; }
    camera.position.lerp(camPos, Math.min(dt*4, 1));
    const aimT = camAim.clone(); if (state === "flying") aimT.lerp(ball.position, 0.3);
    camera.position.x += ox; camera.position.y += oy;
    camera.lookAt(aimT);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

  buildLevel(1);
  document.getElementById("loading").style.display = "none";
  frame();
})();
</script>
</body>
</html>
